seed: 42
data:
  augment: true
  data_dir: /kaggle/working/Trustworthy-AI-for-Dermatology-Imaging/ham10000/data
  img_size: 224
  num_workers: 2
logging:
  checkpoint_dir: ham10000/checkpoints/densenet121_v13_samplerfix
  experiment_name: densenet121_v13_samplerfix
  save_dir: experiments/densenet121_v13_samplerfix
loss:
  name: weighted_focal
  alpha_mode: effective_num
  effective_num_beta: 0.99
  focal_gamma: 1.5
  label_smoothing: 0.1
  class_counts:
  - 890
  - 5367
  - 412
  - 257
  - 891
  - 86
  - 114
model:
  architecture: densenet121
  dropout: 0.35
  freeze_epochs: 0
  metadata_dim: 0
  num_classes: 7
  pretrained: true
output:
  checkpoint_dir: ham10000/checkpoints/densenet121_v13_samplerfix
train:
  batch_size: 32
  early_stopping_patience: 12
  ema_decay: 0.999
  epochs: 45
  gradient_accumulation: 1
  lr: 0.0001
  lr_warmup_epochs: 3
  max_grad_norm: 1.0
  scheduler: cosine
  use_ema: true
  use_weighted_sampler: true
  # THE CHANGE: v12recipe left this unset -> defaulted to 1.0 (full
  # inverse-frequency), which double-corrects for imbalance on top of
  # weighted_focal's effective_num alpha (df/vasc get boosted by both the
  # sampler AND the loss). That combination is known in train.py's own
  # comments to be untested and is the most likely reason macro F1 (0.6484)
  # trails balanced accuracy (0.7496) on the resnet50_v12recipe run --
  # over-correction inflates rare-class recall at the cost of their
  # precision. 0.5 keeps rare classes boosted (not back to natural
  # frequency) but stops the double-counting. This is the single variable
  # changed vs. densenet121_v12recipe -- keep it isolated so you can
  # attribute any F1/precision movement to this fix specifically.
  sampler_power: 0.5
  # New knob (see train.py): "best" checkpoint is now
  # ckpt_score_weight * bal_acc + (1-ckpt_score_weight) * macro_f1, not raw
  # bal_acc. 0.5 = equal weight on your two stated goals (max precision/
  # recall/F1 AND max balanced accuracy).
  ckpt_score_weight: 0.5
  weight_decay: 0.0003
  best_metric_smoothing_window: 5
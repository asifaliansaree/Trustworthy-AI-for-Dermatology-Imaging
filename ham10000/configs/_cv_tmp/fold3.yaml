data:
  augment: true
  cv_kfold_csv: HAM10000_kfold_split.csv
  cv_val_fold: 3
  data_dir: /kaggle/working/Trustworthy-AI-for-Dermatology-Imaging/ham10000/data
  img_size: 224
  num_workers: 2
logging:
  checkpoint_dir: ham10000/checkpoints/convnext_tiny_v1_fold3
  experiment_name: convnext_tiny_v1_fold3
  save_dir: experiments/convnext_tiny_v1_fold3
loss:
  alpha_mode: effective_num
  class_counts:
  - 890
  - 5364
  - 411
  - 262
  - 879
  - 92
  - 114
  effective_num_beta: 0.99
  focal_gamma: 1.5
  label_smoothing: 0.1
  name: weighted_focal
model:
  architecture: convnext_tiny
  dropout: 0.35
  freeze_epochs: 0
  metadata_dim: 0
  num_classes: 7
  pretrained: true
output:
  checkpoint_dir: ham10000/checkpoints/convnext_tiny_v1_fold3
seed: 42
train:
  batch_size: 32
  best_metric_smoothing_window: 5
  ckpt_score_weight: 0.5
  early_stopping_patience: 12
  ema_decay: 0.999
  epochs: 45
  gradient_accumulation: 1
  lr: 0.0001
  lr_warmup_epochs: 3
  max_grad_norm: 1.0
  sampler_power: 0.5
  scheduler: cosine
  use_ema: true
  use_weighted_sampler: true
  weight_decay: 0.0003

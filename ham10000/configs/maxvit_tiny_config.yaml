# HAM10000 -- MaxViT-Tiny -- Track C (Fairness)
# Extracted directly from ham10000-maxvit-tiny.ipynb, Cells 2, 7, 8, and 10.
# Every value here is copied from the notebook's own CONFIG dict and
# transform/scheduler definitions, nothing guessed or filled in.

identity:
  arch_display_name: maxvit_tiny_tf_224
  timm_model_id: maxvit_tiny_tf_224.in1k     # exact pretrained weights used
  seed: 42

build_function: |
  def build_model():
      model = timm.create_model(
          CONFIG["TIMM_MODEL_ID"],
          pretrained=True,
          num_classes=len(CONFIG["CLASS_MAP"]),
          drop_path_rate=CONFIG["DROP_PATH_RATE"],
      )
      return model.to(DEVICE)

data:
  n_folds: 5
  img_size: 224          # MaxViT windowed attention needs this divisible by 7 at every stage
  norm_mean: [0.485, 0.456, 0.406]   # verified against timm pretrained_cfg for this model id
  norm_std: [0.229, 0.224, 0.225]    # coincidentally matches ImageNet, not assumed
  class_map:
    akiec: 0
    bcc: 1
    bkl: 2
    df: 3
    mel: 4
    nv: 5
    vasc: 6

training:
  batch_size: 32
  num_workers: 2
  epochs_max: 25
  warmup_epochs: 2
  patience: 6             # early stop if val_loss hasn't improved in this many epochs
  lr_head: 1.0e-4
  lr_backbone: 1.0e-5     # differential LR, split by whether param name starts with "head."
  weight_decay: 0.05      # AdamW, transformer-standard, not the CNN-style 5e-4
  drop_path_rate: 0.1
  label_smoothing: 0.0
  amp_dtype: float16      # T4 has real fp16 tensor cores
  optimizer: AdamW
  scheduler: warmup_then_cosine   # linear warmup for warmup_epochs, then cosine decay to 0
  loss: CrossEntropyLoss
  loss_class_weighting: true      # weight=class_weights_t passed to CrossEntropyLoss

augmentations:
  train:
    - RandomResizedCrop: {size: [224, 224], scale: [0.8, 1.0]}
    - HorizontalFlip: {p: 0.5}
    - VerticalFlip: {p: 0.5}        # dermoscopic images have no canonical "up"
    - Rotate: {limit: 30, p: 0.7}
    - Normalize: {mean: [0.485, 0.456, 0.406], std: [0.229, 0.224, 0.225]}
    - ToTensorV2: {}
  val:
    - Resize: {height: 224, width: 224}
    - Normalize: {mean: [0.485, 0.456, 0.406], std: [0.229, 0.224, 0.225]}
    - ToTensorV2: {}

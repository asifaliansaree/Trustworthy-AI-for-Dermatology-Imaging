seed: 42
data:
  augment: true
  data_dir: /kaggle/working/Trustworthy-AI-for-Dermatology-Imaging/ham10000/data
  img_size: 224
  num_workers: 2
logging:
  checkpoint_dir: ham10000/checkpoints/convnext_tiny_v1
  experiment_name: convnext_tiny_v1
  save_dir: experiments/convnext_tiny_v1
loss:
  name: weighted_focal
  alpha_mode: effective_num
  effective_num_beta: 0.99
  focal_gamma: 1.5
  label_smoothing: 0.1
  class_counts:
  - 890
  - 5367
  - 412
  - 257
  - 891
  - 86
  - 114
model:
  architecture: convnext_tiny
  dropout: 0.35
  freeze_epochs: 0
  metadata_dim: 0
  num_classes: 7
  pretrained: true
output:
  checkpoint_dir: ham10000/checkpoints/convnext_tiny_v1
train:
  batch_size: 32
  early_stopping_patience: 12
  ema_decay: 0.999
  epochs: 45
  gradient_accumulation: 1
  lr: 0.0001
  lr_warmup_epochs: 3
  max_grad_norm: 1.0
  scheduler: cosine
  use_ema: true
  use_weighted_sampler: true
  # Same sampler_power=0.5 fix applied from the start here (see
  # densenet121_v13_samplerfix.yaml for why) -- no reason to launch a new
  # architecture straight into the same untested double-correction combo.
  sampler_power: 0.5
  ckpt_score_weight: 0.5
  weight_decay: 0.0003
  best_metric_smoothing_window: 5